services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elevatebox
      POSTGRES_PASSWORD: elevatebox
      POSTGRES_DB: elevatebox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevatebox"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://elevatebox:elevatebox@db:5432/elevatebox
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
